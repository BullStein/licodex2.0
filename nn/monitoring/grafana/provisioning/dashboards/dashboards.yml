# Auto-carrega qualquer dashboard .json colocado em
# monitoring/grafana/dashboards/ -- não precisa importar manualmente.
apiVersion: 1

providers:
  - name: "LIBRAS NN Platform"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
